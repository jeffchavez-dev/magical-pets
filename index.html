<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1046">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Magical Pets</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
/* Layout: one phone-width column, one screen at a time, the creature always the centre of attention.
   Single dusk-sky look on purpose (a game world), so every color is set explicitly. */
:root {
  --night: #1b1046;
  --dusk: #3b2090;
  --cream: #fff6fb;
  --muted: #cdbff5;
  --pink: #ff7eb6;
  --pink-deep: #b3457f;
  --blue: #4fc3f7;
  --purple: #b388ff;
  --gold: #ffd86b;
  --font-display: 'Fredoka', 'Trebuchet MS', 'Segoe UI Rounded', sans-serif;
  --font-body: 'Nunito', 'Trebuchet MS', 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--night);
  background-image:
    radial-gradient(1.6px 1.6px at 12% 14%, rgba(255,255,255,.9), transparent),
    radial-gradient(1.2px 1.2px at 78% 9%, rgba(255,255,255,.8), transparent),
    radial-gradient(1.8px 1.8px at 90% 38%, rgba(255,243,168,.9), transparent),
    radial-gradient(1.2px 1.2px at 6% 52%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.4px 1.4px at 44% 22%, rgba(255,255,255,.7), transparent),
    radial-gradient(1.4px 1.4px at 66% 70%, rgba(255,255,255,.6), transparent),
    radial-gradient(1.6px 1.6px at 22% 84%, rgba(255,243,168,.8), transparent),
    radial-gradient(ellipse at 50% -10%, #5a34c4 0%, #2f1a78 45%, #1b1046 100%);
  background-repeat: no-repeat;
  color: var(--cream);
  font-family: var(--font-body);
  font-size: 18px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 24px;
  overflow-x: hidden;
}
#app { max-width: 460px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
.screen { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; padding-block: 12px; min-width: 0; }
h1, h2 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
h1.title { font-size: clamp(44px, 14vw, 64px); font-weight: 700; line-height: 1; letter-spacing: 1px; text-shadow: 0 4px 0 rgba(60,20,140,.7); }
h2 { font-size: 30px; font-weight: 600; line-height: 1.1; }
.kicker { margin: 0; font-family: var(--font-display); font-weight: 500; letter-spacing: 2px; text-transform: uppercase; font-size: 15px; color: var(--gold); }
.lead { margin: 0; max-width: 34ch; color: var(--cream); text-wrap: balance; }
.muted { color: var(--muted); font-size: 15px; margin: 0; }

.btn { font-family: var(--font-display); font-weight: 600; font-size: 21px; min-height: 54px; padding: 0 30px; border: 0; border-radius: 999px; cursor: pointer; }
.btn.primary { background: var(--pink); color: var(--night); box-shadow: 0 5px 0 var(--pink-deep); }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--pink-deep); }
.btn.ghost { background: transparent; color: var(--cream); border: 2px solid rgba(255,255,255,.4); }
.btn:disabled { opacity: .55; cursor: default; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

/* ---------- stones ---------- */
.stone-wrap { width: 220px; height: 220px; display: grid; place-items: center; }
.stone { position: relative; width: 200px; height: 200px; border-radius: 50%; transition: transform 1.4s ease, box-shadow 1.4s ease; box-shadow: 0 0 70px rgba(179,136,255,.6); }
.stone.awake { transform: scale(.55); box-shadow: 0 0 50px var(--s1); }
.stone-rainbow, .stone-solid { position: absolute; inset: 0; border-radius: 50%; transition: opacity 1.2s ease; }
.stone-rainbow { background: conic-gradient(#4fc3f7, #b388ff, #ff7eb6, #ffd86b, #6ee7b7, #4fc3f7); animation: spin 9s linear infinite; }
.stone-solid { opacity: 0; background: radial-gradient(circle at 50% 55%, var(--s1), var(--s2)); }
.stone.awake .stone-rainbow { opacity: 0; }
.stone.awake .stone-solid { opacity: 1; }
.stone::after { content: ""; position: absolute; inset: 0; border-radius: 50%; background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.75), transparent 36%); }
.stone-s { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 96px; color: #fff; text-shadow: 0 3px 0 rgba(0,0,0,.25); opacity: 0; transition: opacity 1s ease .9s; z-index: 1; }
.stone.awake .stone-s { opacity: 1; }
.sun { width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff7c2, #ffd86b 60%, #ffb347); box-shadow: 0 0 40px 10px rgba(255,216,107,.55); transition: transform 1.2s ease, box-shadow 1.2s ease; animation: pulse 3s ease-in-out infinite; }
.sun.bright { transform: scale(1.5); box-shadow: 0 0 90px 36px rgba(255,216,107,.7); }

/* ---------- egg ---------- */
.egg-stage { position: relative; width: 100%; height: 260px; display: grid; place-items: center; }
.egg { position: relative; width: 190px; height: 218px; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 50% 50% 46% 46%; }
.egg svg { width: 100%; height: 100%; display: block; overflow: visible; }
.egg.chosen { filter: drop-shadow(0 0 26px var(--s1)); animation: glow 2s ease-in-out infinite; }
.egg.wob { animation: wobble .5s ease; }
.crack { opacity: 0; transition: opacity .2s; }
.egg[data-taps="1"] .c1, .egg[data-taps="2"] .c1, .egg[data-taps="2"] .c2, .egg[data-taps="3"] .crack { opacity: 1; }
.mini-stone { position: absolute; right: 8%; top: 22%; width: 64px; height: 64px; border-radius: 50%; background: radial-gradient(circle at 30% 26%, rgba(255,255,255,.7), transparent 36%), radial-gradient(circle at 50% 55%, var(--s1), var(--s2)); box-shadow: 0 0 26px var(--s1); display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 34px; color: #fff; transition: transform .9s ease, opacity .9s ease; animation: bob 3s ease-in-out infinite; }
.egg-row { display: flex; justify-content: center; gap: 8px; width: 100%; }
.egg-row .egg { width: 31%; max-width: 124px; height: auto; aspect-ratio: 190 / 218; }
.egg.tried { filter: grayscale(.85) brightness(.8); opacity: .75; }
.egg.dim { opacity: .18; filter: grayscale(.6); pointer-events: none; }
.egg.bad { animation: wobble .5s ease 2; }
.dock { position: relative; width: 100%; height: 96px; display: grid; place-items: center; }
.dock .mini-stone { position: relative; right: auto; top: auto; }
.mglow { opacity: .85; }
.mini-stone.merge { transform: scale(.4); opacity: 0; animation: none; pointer-events: none; }

/* ---------- pets ---------- */
.pet-wrap { position: relative; width: min(300px, 78vw); aspect-ratio: 1; display: grid; place-items: center; }
.pet-wrap::before { content: ""; position: absolute; inset: 10% 0 -2%; border-radius: 50%; background: radial-gradient(circle, rgba(255,126,182,.28), transparent 68%); }
.pet { position: relative; width: 100%; height: 100%; transform-origin: 50% 88%; }
.pet.stage2 { scale: 1.1; }
.pet.stage3 { scale: 1.2; }
.pet.stage4 { scale: 1.28; filter: drop-shadow(0 0 14px rgba(255,216,107,.65)); }
.renbtn { width: 34px; height: 34px; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(27,16,70,.6); color: var(--cream); cursor: pointer; font-size: 16px; vertical-align: middle; margin-left: 6px; }
.renbtn.small { width: 28px; height: 28px; font-size: 13px; margin-left: 2px; }
.req.maxreq { background: #ffd86b; color: #4a3300; }
.req.tollreq { background: #ffd1d1; color: #5a1a1a; }
.maxrow .btn { margin-top: 6px; }
.maxring { transform-origin: 100px 106px; animation: maxspin 14s linear infinite; }
@keyframes maxspin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .maxring { animation: none; } }
.pet-svg { width: 100%; height: 100%; display: block; overflow: visible; animation: bob 3.2s ease-in-out infinite; }
.pet-wrap.hop .pet { animation: hop .6s ease; }
.pet.evolving { animation: shake .22s linear infinite; filter: brightness(1.5) drop-shadow(0 0 26px var(--gold)); }
.hatchpop .pet { animation: pop .8s cubic-bezier(.2,1.4,.4,1); }
.eyes-happy, .mouth-open, .eyes-sad, .mouth-sad, .brows-sad, .tear, .eyes-angry, .brows-angry, .mouth-angry, .steam { display: none; }
[data-mood="happy"] .eyes-open, [data-mood="happy"] .mouth-smile, [data-mood="sad"] .eyes-open, [data-mood="sad"] .mouth-smile, [data-mood="angry"] .eyes-open, [data-mood="angry"] .mouth-smile { display: none; }
[data-mood="happy"] .eyes-happy, [data-mood="happy"] .mouth-open, [data-mood="sad"] .eyes-sad, [data-mood="sad"] .mouth-sad, [data-mood="sad"] .brows-sad, [data-mood="sad"] .tear, [data-mood="angry"] .eyes-angry, [data-mood="angry"] .mouth-angry, [data-mood="angry"] .brows-angry, [data-mood="angry"] .steam { display: inline; }
[data-mood="angry"] .blush { fill: #ff4d6d; opacity: .7; }
[data-mood="sad"] .blush { opacity: .15; }
.tear { animation: tear 1.6s ease-in infinite; }
@keyframes tear { 0% { transform: translateY(-4px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(12px); opacity: 0; } }
.eyes-open ellipse { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
.fx { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.heart { position: absolute; bottom: 38%; width: 26px; height: 26px; animation: floatup 1.1s ease-out forwards; }

.head { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.petname { font-size: 34px; }
.badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.badge { display: inline-flex; align-items: center; gap: 7px; min-height: 30px; padding: 0 12px; border-radius: 999px; font-family: var(--font-display); font-weight: 500; font-size: 15px; background: rgba(255,255,255,.14); color: var(--cream); }
.badge i { width: 11px; height: 11px; border-radius: 50%; background: var(--dot, #fff); display: inline-block; }
.badge.r-powerful { background: var(--blue); color: var(--night); }
.badge.r-super { background: var(--purple); color: var(--night); }
.badge.r-legend { background: linear-gradient(90deg, #ff9ec9, #ffe98a, #9ef0c8, #8fd0ff, #c9a8ff, #ff9ec9); background-size: 300% 100%; color: var(--night); animation: shimmer 3s linear infinite; }
.badge.r-ultra { background: linear-gradient(90deg, #ffe98a, #ffb347, #ffe98a); background-size: 200% 100%; color: var(--night); animation: shimmer 2.4s linear infinite; }

.msg { margin: 0; min-height: 3em; max-width: 32ch; text-wrap: balance; }
.meter-box { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.meter { height: 22px; border-radius: 999px; background: rgba(255,255,255,.16); overflow: hidden; border: 2px solid rgba(255,255,255,.25); }
.meter-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--purple), var(--pink)); transition: width .5s ease; }
.meter-row { display: flex; justify-content: space-between; font-family: var(--font-display); font-weight: 500; font-size: 16px; }
.acts { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.act { min-height: 82px; border-radius: 22px; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.28); color: var(--cream); font-family: var(--font-display); font-weight: 600; font-size: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; }
.act svg { width: 30px; height: 30px; }
.act:active { background: rgba(255,255,255,.24); }
.act.wanted { border-color: var(--gold); background: rgba(255,216,107,.28); animation: pulse2 .8s ease-in-out 3; }
.act:disabled { opacity: .5; cursor: default; }
.banner { margin: 0; font-family: var(--font-display); font-size: 30px; font-weight: 700; color: var(--gold); text-shadow: 0 3px 0 rgba(60,20,140,.7); }
.evolve-line { margin: -8px 0 0; color: var(--cream); max-width: 32ch; text-wrap: balance; }
.field { width: 100%; max-width: 300px; font-family: var(--font-display); font-weight: 500; font-size: 24px; text-align: center; padding: 12px 16px; min-height: 54px; border-radius: 18px; border: 2px solid rgba(255,255,255,.4); background: rgba(255,255,255,.1); color: var(--cream); box-sizing: border-box; }
#flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 10; }
#flash.on { animation: flash .9s ease-out; }

/* ---------- professor ---------- */
.prof-scene { position: relative; width: min(340px, 94%); aspect-ratio: 340 / 300; }
.bot-svg { width: 100%; height: 100%; display: block; overflow: visible; }
.bot-eye { transform-box: fill-box; transform-origin: center; animation: blink 4.5s infinite; }
.prof-stone { position: absolute; left: 77.4%; top: 48.7%; width: 24.7%; aspect-ratio: 1; transform: translate(-50%, -50%); }
.prof-stone .stone { width: 100%; height: 100%; box-shadow: 0 0 34px rgba(179,136,255,.75); animation: bob 2.8s ease-in-out infinite; }
.bubble { position: relative; margin: 6px 0 0; padding: 12px 18px; max-width: 30ch; border-radius: 20px; background: var(--cream); color: var(--night); font-family: var(--font-display); font-weight: 500; font-size: 19px; line-height: 1.3; text-wrap: balance; }
.bubble::before { content: ""; position: absolute; left: 50%; top: -9px; margin-left: -9px; border: 9px solid transparent; border-top: 0; border-bottom-color: var(--cream); }

/* ---------- world ---------- */
.world-screen, .universe-screen { justify-content: flex-start; gap: 0; position: fixed; inset: 0; padding: 0; align-items: stretch; z-index: 1; }
body.in-world { padding: 0; overflow: hidden; height: 100%; overscroll-behavior: none; }
.btn.small { min-height: 44px; padding: 0 18px; font-size: 17px; }
.hud { position: absolute; top: 0; left: 0; right: 0; z-index: 7; display: flex; flex-direction: column; gap: 4px; pointer-events: none;
  padding: max(6px, env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px));
  background: linear-gradient(rgba(15,8,51,.7), rgba(15,8,51,.35) 70%, rgba(15,8,51,0)); }
.hud > * { pointer-events: auto; }
.hud .btn.small { min-height: 38px; padding: 0 13px; font-size: 14px; background: rgba(27,16,70,.78); white-space: nowrap; }
.hud .wmeter { max-width: 280px; padding: 2px 10px 4px; border-radius: 12px; background: rgba(27,16,70,.62); font-size: 12px; }
.hud .wmeter .meter { height: 10px; }
.hud .inv { justify-content: flex-start; flex-wrap: nowrap; overflow-x: auto; gap: 6px; touch-action: pan-x; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.hud .inv::-webkit-scrollbar { display: none; }
.hud .chip { flex: none; min-height: 24px; padding: 0 9px; font-size: 12px; background: rgba(27,16,70,.7); white-space: nowrap; }
.fsbtn { flex: none; width: 38px; height: 38px; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.4); background: rgba(27,16,70,.78); color: var(--cream); cursor: pointer; display: grid; place-items: center; margin-left: auto; }
.fsbtn[hidden] { display: none; }
.hudtog { display: none; }
.hudtog .eyeslash { opacity: 0; }
.hudtog[data-m=hide] .eyeslash { opacity: 1; }
@media (pointer: coarse), (max-width: 760px) {
  .hudtog { display: grid; }
  body.hudm-fade .hud { opacity: .28; transition: opacity .3s; }
  body.hudm-hide .hud { visibility: hidden; }
  body.hudm-hide .hud .hudtog { visibility: visible; position: fixed; top: 112px; right: max(14px, env(safe-area-inset-right, 0px)); margin: 0; }
}
.playsnd { position: fixed; top: max(10px, env(safe-area-inset-top, 0px)); right: max(10px, env(safe-area-inset-right, 0px)); margin: 0; z-index: 20; }
.fsbtn.nomargin { margin-left: 0; }
.sndbtn.off { opacity: .75; } .sndbtn .snd-off { display: none; } .sndbtn.off .snd-off { display: block; } .sndbtn.off .snd-on { display: none; }
.utop .sndbtn { margin-left: auto; }
.sndbtn.wait { box-shadow: 0 0 0 3px rgba(255,214,102,.9); animation: sndwait 1.3s ease-in-out infinite; }
@keyframes sndwait { 50% { box-shadow: 0 0 0 7px rgba(255,214,102,.25); } }
@media (prefers-reduced-motion: reduce) { .sndbtn.wait { animation: none; } }
.zoombtns { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%); z-index: 5; display: flex; flex-direction: column; gap: 8px; }
.birds:not([hidden]) ~ .zoombtns { display: none; }
.zbtn { width: 44px; height: 44px; padding: 0; border-radius: 50%; border: 2px solid rgba(255,255,255,.5); background: rgba(27,16,70,.78); color: var(--cream); cursor: pointer; display: grid; place-items: center; }
.zbtn svg { width: 22px; height: 22px; }
.zbtn:active { background: var(--gold); color: var(--night); }
.rotatehint { display: none; position: absolute; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 8; width: calc(100% - 20px); max-width: 420px; box-sizing: border-box; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; border-radius: 18px; background: rgba(27,16,70,.94); border: 2px solid rgba(255,255,255,.4); font-family: var(--font-display); font-weight: 500; font-size: 14px; line-height: 1.2; text-align: left; }
.rotatehint .btn.small { min-height: 36px; padding: 0 12px; font-size: 14px; flex: none; background: var(--gold); color: var(--night); border: 0; }
.rotatehint span { flex: 1; min-width: 0; }
.rotatehint .rx { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 0; background: rgba(255,255,255,.15); color: var(--cream); font-size: 20px; line-height: 1; cursor: pointer; }
@media (orientation: portrait) and (pointer: coarse) and (max-width: 820px) { .rotatehint { display: flex; } }
@media (min-width: 760px), (orientation: landscape) and (max-height: 520px) {
  .hud { flex-direction: row; align-items: center; gap: 12px; padding-bottom: 10px; }
  .hud .inv { flex: 1; min-width: 0; }
  .hud .wmeter { min-width: 170px; }
}
.fsbtn svg { width: 22px; height: 22px; }
@media (min-width: 760px) {
  .hud { flex-direction: row; align-items: center; gap: 12px; padding-bottom: 14px; }
  .hud .inv { flex: 1; min-width: 0; }
  .hud .wmeter { min-width: 190px; }
  .hud .chip { font-size: 14px; min-height: 30px; }
}
.wbar { display: flex; align-items: center; gap: 10px; flex: none; }
.wmeter { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; font-family: var(--font-display); font-weight: 500; font-size: 14px; }
.wmeter-row { display: flex; justify-content: space-between; }
.wmeter .meter { height: 14px; }
.inv { width: 100%; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 12px; border-radius: 999px; background: rgba(255,255,255,.14); font-family: var(--font-display); font-weight: 500; font-size: 15px; }
.sdot { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.sprite { position: absolute; left: 0; top: 0; cursor: grab; touch-action: none; }
.sprite .pet-svg { animation: bob 3.2s ease-in-out infinite; pointer-events: none; }
.sprite.walk .pet-svg { animation: waddle .38s ease-in-out infinite; }
.sprite.held { cursor: grabbing; filter: drop-shadow(0 12px 8px rgba(0,0,0,.35)); }
.sprite.held .pet-svg { animation: wiggle .3s ease-in-out infinite; }
.sprite.evolving { filter: brightness(1.5) drop-shadow(0 0 22px var(--gold)); }
.sprite.evolving .pet-svg { animation: shake .22s linear infinite; }
.sprite .tag { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: -8px; padding: 1px 9px; border-radius: 999px; background: rgba(27,16,70,.72); color: var(--cream); font-family: var(--font-display); font-weight: 500; font-size: 13px; white-space: nowrap; pointer-events: none; }
.sprite .tag.wildtag { background: rgba(255,255,255,.8); color: var(--night); }
.mstone { position: absolute; left: 50%; top: -20px; width: 24px; height: 24px; margin-left: -12px; border-radius: 50%; background: radial-gradient(circle at 30% 28%, #fff, #e9defa 60%, #cdbff5); color: #a58fd6; font-family: var(--font-display); font-weight: 700; font-size: 15px; display: grid; place-items: center; box-shadow: 0 0 14px rgba(255,255,255,.85); animation: bob 2.4s ease-in-out infinite; pointer-events: none; }
.sprite.merge { filter: drop-shadow(0 0 22px var(--s1)); }
.sprite.merge .mstone { background: radial-gradient(circle at 30% 28%, #fff, var(--s1) 60%, var(--s2)); color: #fff; animation: mergepop 1.3s ease forwards; }
.wheart { position: absolute; width: 22px; height: 22px; pointer-events: none; z-index: 999; animation: floatup 1.1s ease-out forwards; }
.catchbar { width: 100%; min-height: 104px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.catchbar p { margin: 0; }
#app.wide { max-width: none; margin: 0; min-height: 0; }
.scene { position: relative; width: 100%; flex: 1; min-height: 0; border-radius: 0; overflow: hidden; touch-action: none; border: 0; box-sizing: border-box; background: #2c86d8; user-select: none; -webkit-user-select: none; }
/* ----- immersive walk view ----- */

<script>
(function () {
  'use strict';

  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };

  /* ---------- game data ---------- */
  var STONES = [
    { id: 'blue', label: 'blue', s1: '#4fc3f7', s2: '#1e88e5' },
    { id: 'pink', label: 'pink', s1: '#ff7eb6', s2: '#e0409a' },
    { id: 'purple', label: 'purple', s1: '#b388ff', s2: '#7c4dff' }
  ];
  // Rarity odds are placeholders until Mira decides what the kinds mean.
  // w = how often a hatched/wild pet is this rare; merge = chance the Happy Stone and Magical Stone merge.
  var RARITIES = [
    { id: 'wild', label: 'Wild', w: 60, merge: 0.92 },
    { id: 'powerful', label: 'Powerful', w: 27, merge: 0.75 },
    { id: 'super', label: 'Super rare', w: 10, merge: 0.5 },
    { id: 'ultra', label: 'Ultra rare', w: 3, merge: 0.25 },
    { id: 'legend', label: 'Super ultra rare', w: 0, merge: 0.12 }
  ];
  function rarityById(id) { for (var i = 0; i < RARITIES.length; i++) if (RARITIES[i].id === id) return RARITIES[i]; return RARITIES[0]; }
  var NAMES = ['Mochi', 'Pip', 'Nimbus', 'Bubbles', 'Twinkle', 'Waffle', 'Sprout', 'Luna', 'Biscuit', 'Poppy'];
  var ACTIONS = {

    feed: { label: 'Feed', gain: 9, lines: ['{n} munches a sweet berry.', '{n} licks its lips and smiles.'] },
    play: { label: 'Play', gain: 12, lines: ['{n} bounces all around!', '{n} chases the ball in circles.'] }
  };

  var NEEDS = {

    ice: { pet: 5, feed: 3, play: 3 }, psychic: { pet: 6, feed: 2, play: 3 }, fairy: { pet: 4, feed: 4, play: 4 }, unicorn: { pet: 5, feed: 5, play: 5 },
    electric: { pet: 2, feed: 3, play: 6 }, earth: { pet: 4, feed: 6, play: 2 }, wind: { pet: 3, feed: 2, play: 6 }, shadow: { pet: 6, feed: 3, play: 3 }

  var RAR_MULT = { wild: 1, powerful: 1.15, super: 1.3, ultra: 1.5, legend: 1.8 };
  var BODY_TWIST = { dog: { play: 1 }, cat: { pet: 1 }, bird: { feed: 1 }, bunny: { feed: 1 }, fox: { play: 1 }, fish: { pet: 1 }, bear: { pet: 1 }, frog: { play: 1 }, turtle: { pet: 1 }, mouse: { feed: 1 }, owl: { pet: 1 }, deer: { play: 1 }, hedgehog: { feed: 1 }, bat: { play: 1 } };
  var LABEL = { pet: 'cuddles', feed: 'snacks', play: 'games' };
  var KINDS = ['pet', 'feed', 'play'];
  // how much food one snack costs: it depends on the pet's type, and bigger (evolved) pets eat more
  var FOOD_BASE = { water: 1, grass: 1, fairy: 2, psychic: 2, ice: 2, fire: 3, unicorn: 4, electric: 3, earth: 2, wind: 1, shadow: 3 };
  function foodCost(p) { return (FOOD_BASE[p.type] || 2) + ((p.stage || 1) - 1); }
  function needFor(p) {
    var base = NEEDS[p.type] || NEEDS.fairy, tw = BODY_TWIST[p.body] || {}, k = (p.stage >= 2 ? 1.6 : 1) * (RAR_MULT[p.rid] || 1), n = {};
    KINDS.forEach(function (a) { n[a] = Math.max(1, Math.round((base[a] + (tw[a] || 0)) * k)); });

  }
  function progOf(p) { if (!p.prog) p.prog = { pet: 0, feed: 0, play: 0 }; return p.prog; }

    KINDS.forEach(function (a) { t += n[a]; d += Math.min(pr[a], n[a]); });

  }
  function isFull(p, kind) { return progOf(p)[kind] >= needFor(p)[kind]; }

    var pr = progOf(p), n = needFor(p), before = pr[kind];

    p.happy = progPct(p);
    return pr[kind] - before;
  }
  function mostNeeded(p) {

  }
  function needsText(p) {
    var n = needFor(p), pr = progOf(p), out = [], w = { pet: 'cuddle', feed: 'snack', play: 'game' };
    KINDS.forEach(function (a) { var r = n[a] - pr[a]; if (r > 0) out.push(r + ' more ' + w[a] + (r > 1 ? 's' : '')); });
    return out.length ? out.join(', ') : 'nothing more';
  }

    }).join('');

  function migrateProg(p) {

    if (p.stage < 3) p.happy = progPct(p);
  }
  // each kind of animal reacts in its own way
  var LINES = {
    frog: { pet: ['{n} croaks a soft, happy croak.', '{n} blinks slowly and puffs its throat.'], feed: ['{n}\'s tongue zaps out and snaps up the berry!', '{n} gulps it down. Ribbit!'], play: ['{n} leaps from lily pad to lily pad!', '{n} does a huge froggy jump.'] },

    owl: { pet: ['{n} hoots softly and fluffs its feathers.', '{n} turns its head all the way round, smiling.'], feed: ['{n} swallows the berry in one gulp. Hoo!', '{n} blinks its big eyes and eats.'], play: ['{n} swoops silently in a big loop!', '{n} flaps and hoots a happy tune.'] },
    deer: { pet: ['{n} nuzzles you gently.', '{n} bows its head to be stroked.'], feed: ['{n} nibbles daintily, ears flicking.', '{n} munches the leaves with a soft crunch.'], play: ['{n} bounds across the grass!', '{n} leaps high with all four hooves.'] },
    hedgehog: { pet: ['{n} relaxes its spikes into a soft fluff.', '{n} snuffles your finger.'], feed: ['{n} crunches loudly and snuffles for more.', '{n} rolls the berry along on its nose.'], play: ['{n} curls into a ball and rolls about!', '{n} scampers in zig-zags.'] },
    bat: { pet: ['{n} wraps its wings around itself, content.', '{n} squeaks and hangs upside down happily.'], feed: ['{n} munches the berry upside down.', '{n} squeaks for a second helping.'], play: ['{n} flutters in swooping loops!', '{n} flips and glides around you.'] },
    dog: { pet: ['{n} wags its tail so fast it blurs.', '{n} flops over for a belly rub!'], feed: ['{n} gobbles it up and licks its nose.', '{n} woofs for more!'], play: ['{n} fetches the ball and brings it back.', '{n} zooms around in happy circles!'] },

      var p = newPet(e.type, e.rid, e.body); if (p.type === 'unicorn') { p.uc = UNI_CHARGES; p.ut = wasSpirit ? uniTierFor(wasSpirit) : UNI_TIER; }
      p.name = wasGuardian ? 'Starlight' : wasSpirit ? UNI_NAME[wasSpirit] : freeName(w);
      S.team.push(p); S.caught[p.type] = true;
      if (wasGuardian) S.freed.crystal = true;
      if (wasSpirit) S.uni[wasSpirit] = true;
      save();
      wmsg('The Happy Stone and the pale Magical Stone merge...');
      updateHud(); nearId = null; updateCatchBar();
      later(function () {
        e.merging = false; e.kind = 'follower'; e.pet = p; e.stage = 1; e.name = p.name; e.id = 'p' + p.id; e.guardian = false; e.spirit = 0;
        if (e.el) {
          e.el.className = 'sprite follower';
          e.el.dataset.id = e.id;
          e.size = spriteSize(e);
          e.el.style.width = e.size + 'px'; e.el.style.height = e.size + 'px';
          e.el.innerHTML = spriteHTML(e);
        }
        if (S.screen === 'world' && S.world === w) {
          var n = Object.keys(S.caught).length;
          wmsg(wasGuardian ? 'The unicorn is your friend now! The stones are free to take.' : wasSpirit ? 'You rescued the unicorn spirit! ' + p.name + ' is your friend now.' : e.name + ' wants you as its owner!' + (n === TYPE_IDS.length ? ' You found every type in this prototype!' : ''));
          worldBurst(e.x, e.y - 50); updateHud(); updateCatchBar();
        }
        if (!wasGuardian && !wasSpirit) later(function () {
          if (S.world !== w || S.screen !== 'world') return;
          var ne = makeWild(w); w.ents.push(ne);
          makeEl(ne);
        }, 5000);
      }, 1400);
    },
    again: function () {
      save();
      S.stone = pick(STONES); S.awake = false; S.awakening = false; S.chosen = null; S.taps = 0; S.eggs = null; S.merging = false;
      S.screen = 'sun'; render();
    }
  };

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]');
    if (!b || b.disabled) return;
    var fn = handlers[b.dataset.act];
    if (fn) fn(b, e);
  });
  document.addEventListener('keydown', function (e) {
    if (battle && battle.mode === 'dodge' && !battle.over && !/INPUT|TEXTAREA/.test(e.target.tagName)) {
      var k = e.key;
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') { dodgeGo(battle, battle.lane - 1); e.preventDefault(); }
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') { dodgeGo(battle, battle.lane + 1); e.preventDefault(); }
    }
    if (e.key === 'Enter' && e.target && e.target.id === 'petname') handlers.hello();
    if (e.key === 'Enter' && e.target && e.target.id === 'renin') { var rb = document.querySelector('[data-act=rensave]'); if (rb) renameSave(+rb.dataset.id); }
  });

  newGame();
  render();
})();
</script>
</body>
</html>
